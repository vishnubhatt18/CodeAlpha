<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaShift — Language Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="logo">
      <span class="logo-orb"></span>
      <span class="logo-text">LinguaShift</span>
    </div>
    <p class="tagline">Translate anything, instantly</p>
  </header>

  <!-- ── Main Card ── -->
  <main class="main">
    <div class="card">

      <!-- Language bar -->
      <div class="lang-bar">
        <div class="lang-select-wrap">
          <label class="lang-label">From</label>
          <select id="sourceLang" class="lang-select">
            <option value="auto">Auto Detect</option>
            {% for code, name in languages.items() %}
              {% if code != 'auto' %}
              <option value="{{ code }}">{{ name }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>

        <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>

        <div class="lang-select-wrap">
          <label class="lang-label">To</label>
          <select id="targetLang" class="lang-select">
            {% for code, name in languages.items() %}
              {% if code != 'auto' %}
              <option value="{{ code }}" {% if code == 'hi' %}selected{% endif %}>{{ name }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Text panels -->
      <div class="panels">

        <!-- Source -->
        <div class="panel panel--source">
          <div class="panel-header">
            <span class="panel-title" id="sourceTitle">Source text</span>
            <span class="char-count" id="charCount">0 / 5000</span>
          </div>
          <textarea
            id="sourceText"
            class="panel-textarea"
            placeholder="Type or paste text here…"
            maxlength="5000"
            spellcheck="true"
          ></textarea>
          <div class="panel-footer">
            <button class="action-btn" id="clearBtn" title="Clear text">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              Clear
            </button>
            <button class="action-btn tts-btn" id="sourceTtsBtn" title="Listen">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              Listen
            </button>
            <button class="translate-btn" id="translateBtn">
              <span id="btnText">Translate</span>
              <span class="spinner" id="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="panel-divider"></div>

        <!-- Target -->
        <div class="panel panel--target">
          <div class="panel-header">
            <span class="panel-title" id="targetTitle">Translation</span>
            <span class="detected-badge" id="detectedBadge" style="display:none"></span>
          </div>
          <div id="targetText" class="panel-output" aria-live="polite">
            <span class="placeholder-output">Translation will appear here…</span>
          </div>
          <div class="panel-footer panel-footer--right">
            <button class="action-btn" id="copyBtn" title="Copy translation" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
            <button class="action-btn tts-btn" id="targetTtsBtn" title="Listen to translation" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              Listen
            </button>
          </div>
        </div>

      </div><!-- /panels -->

      <!-- Error banner -->
      <div class="error-banner" id="errorBanner" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMsg"></span>
      </div>

    </div><!-- /card -->

    <!-- Quick language chips -->
    <div class="quick-langs">
      <span class="quick-label">Quick pick:</span>
      <button class="chip" data-lang="fr">French</button>
      <button class="chip" data-lang="de">German</button>
      <button class="chip" data-lang="es">Spanish</button>
      <button class="chip" data-lang="ja">Japanese</button>
      <button class="chip" data-lang="ar">Arabic</button>
      <button class="chip" data-lang="zh">Chinese</button>
      <button class="chip" data-lang="hi">Hindi</button>
      <button class="chip" data-lang="ru">Russian</button>
    </div>
  </main>

  <footer class="footer">Built with Python Flask &amp; Google Translate · LinguaShift</footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
